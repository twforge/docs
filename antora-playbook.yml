site:
  title: TW Forge
  url: https://docs.twforge.net
  start_page: de::index.adoc

antora:
  extensions:
    - require: '@antora/lunr-extension'

content:
  sources:
    - url: .
      branches: HEAD
      start_paths:
        - docs-en
        - docs-de

ui:
  bundle:
    # Vendored Antora Default UI (pinned, no download at build time), see antora-ui/README.md
    url: ./antora-ui/ui-bundle.zip
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

runtime:
  log:
    failure_level: warn
