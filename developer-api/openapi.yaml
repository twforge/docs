openapi: 3.0.3
info:
  title: TW Forge Developer API
  description: |
    TW Forge API for Tribalwars developers.

    Enumerations may gain new values without a major version change of the API, so clients must tolerate values unknown to them.
  version: 1.2.0
  contact:
    name: TWForge
    url: https://github.com/twforge

servers:
  - url: https://twforge.net/api/v1
    description: Production

security:
  - defaultApiKey: [ ]

paths:
  /db-info/userscript:
    post:
      security: [ ]
      deprecated: true
      summary: Village information.
      description: |
        Retrieves village information (tribalwars action).
        
        This endpoint is deprecated and only provided for compatibility with existing scripts. If you plan to create a
        new script please prefer to use the other endpoints.
      operationId: dbInfoApi
      tags:
        - db-info
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - tribalwars
          description: API action type
        - name: Origin
          description: Used to determine the world this request belongs to.
          in: header
          required: true
          schema:
            type: string
            example: de250.die-staemme.de
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - $ref: '#/components/schemas/DbInfoTribalWarsRequest'
      responses:
        '200':
          description: Successful response - returns village information for tribalwars action.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DbInfoTribalwarsResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/tw/worlds/{world}/report-import-tasks:
    post:
      tags:
        - reports
      summary: Used to upload a batch of reports supplying a text containing slugs or public links.
      description: |
        Creates a batch of report-import-tasks. These tasks will be added to a queue and asynchronously imported.
        
        The response only reveals how many tasks were created from the supplied text.
      operationId: importReports
      parameters:
        - $ref: '#/components/parameters/world'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportImportRequest'
      responses:
        200:
          description: The number of tasks that were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportImportResponse'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /reports/tw/worlds/{world}/villages/{villageId}/dossier:
    parameters:
      - $ref: '#/components/parameters/world'
      - name: villageId
        in: path
        required: true
        description: The game's village id.
        schema:
          type: integer
          format: int32
    get:
      tags:
        - village-dossier
      summary: Get the dossier for a village.
      description: >-
        Aggregates the current user's authorized village classifications and recent reports into a
        compact read model.
      operationId: getVillageDossier
      responses:
        200:
          description: The village dossier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VillageDossier'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
        404:
          $ref: '#/components/responses/notFound'
  /reports/tw/worlds/{world}/reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/world'
      - name: reportId
        in: path
        required: true
        description: The report's id, as carried by every `DossierReportRef`.
        schema:
          type: integer
          format: int64
    get:
      tags:
        - battle-report
      summary: Get a single battle report.
      description: >-
        One stored battle report in full. Everything describing one side of the fight is omitted when
        that side's data may not be shown to the current user, e.g. because an allied tribe opted out of
        sharing internal data.
      operationId: getBattleReport
      responses:
        200:
          description: The report. An absent field was either not part of the report or is not visible.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BattleReport'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
        404:
          $ref: '#/components/responses/notFound'
  /planner/tw/worlds/{world}/support-boosts/players/{playerId}/tribe-skill-activations:
    parameters:
      - $ref: '#/components/parameters/world'
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags:
        - support-boost
      summary: Get the active support boost tribe skills for the given player.
      operationId: getTribeSkillActivations
      responses:
        200:
          description: The active support boost tribe skills.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TribeSkillActivation'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
    post:
      tags:
        - support-boost
      summary: Report a tribe skill activation for the given player.
      operationId: createTribeSkillActivation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTribeSkillActivationRequest'
      responses:
        200:
          description: The created resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TribeSkillActivation'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /planner/tw/worlds/{world}/support-boosts/players/{playerId}/tribe-skill-activations/{id}:
    parameters:
      - $ref: '#/components/parameters/world'
      - name: playerId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags:
        - support-boost
      summary: Delete a previously reported tribe skill activation.
      operationId: deleteTribeSkillActivation
      responses:
        204:
          description: The resource was deleted.
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /planner/tw/worlds/{world}/support-boosts/villages/{villageId}/sigil-distress-activations:
    parameters:
      - $ref: '#/components/parameters/world'
      - name: villageId
        in: path
        required: true
        schema:
          type: integer
          format: int32
    get:
      tags:
        - support-boost
      summary: Get the active sigil of distress activations for the given village.
      operationId: getSigilDistressActivations
      responses:
        200:
          description: The page of activations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SigilDistressActivation'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
    post:
      tags:
        - support-boost
      summary: Create sigil of distress activation.
      operationId: createSigilDistressActivation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSigilDistressActivationRequest'
      responses:
        200:
          description: The created activation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigilDistressActivation'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /planner/tw/worlds/{world}/support-boosts/villages/{villageId}/sigil-distress-activations/{id}:
    parameters:
      - $ref: '#/components/parameters/world'
      - name: villageId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
    delete:
      tags:
        - support-boost
      summary: Delete sigil of distress activation.
      operationId: deleteSigilDistressActivation
      responses:
        204:
          description: The activation was deleted.
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /planner/tw/worlds/{world}/support-boosts/villages/{villageId}/active-boost:
    parameters:
      - $ref: '#/components/parameters/world'
      - name: villageId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: include-shared
        in: query
        required: false
        description: |
          Whether support boost activations that were shared with the current user should also be included. Set to
          false to only consider the activations reported by the current user.
        schema:
          type: boolean
          default: true
      - name: at-time
        in: query
        required: false
        description: |
          The point in time for when the support-boosts should be checked. Defaults to now.
        schema:
          type: string
          format: date-time
    get:
      tags:
        - support-boost
      summary: Get the aggregated active support boost for the given village at the given time.
      operationId: getActiveSupportBoost
      responses:
        200:
          description: The active boost.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveSupportBoost'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /analyser/tw/worlds/{world}/incoming-attacks:
    parameters:
      - $ref: '#/components/parameters/world'
    get:
      tags:
        - incoming-attacks
      summary: Get a page of incoming attacks.
      operationId: getIncomingAttacks
      description: |
        Page of still-upcoming incoming attacks the current user is allowed to see, soonest arrival first. Includes
        attacks imported by other users.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: defender-id
          in: query
          required: false
          description: Only return attacks against the given players.
          explode: false
          schema:
            type: array
            uniqueItems: true
            maxItems: 100
            items:
              type: integer
              format: int64
        - name: village-id
          in: query
          required: false
          explode: false
          schema:
            type: array
            uniqueItems: true
            maxItems: 100
            items:
              type: integer
              format: int32
      responses:
        200:
          description: The page of incoming attacks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncomingAttackPage'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /analyser/tw/worlds/{world}/incoming-attacks/ratings:
    parameters:
      - $ref: '#/components/parameters/world'
    get:
      tags:
        - incoming-attacks
      summary: Get the ratings for attacks uploaded by the current user.
      operationId: getIncomingAttackRatings
      responses:
        200:
          description: The list of attack ratings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StandaloneAttackRating'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /analyser/tw/worlds/{world}/incoming-attacks/sos-requests:
    parameters:
      - $ref: '#/components/parameters/world'
    post:
      tags:
        - incoming-attacks
      summary: Import incoming attacks via SOS Request.
      operationId: importSosRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportIncomingAttacksSosRequest'
      responses:
        200:
          description: The parsed sos request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParsedSosRequest'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
  /analyser/tw/worlds/{world}/incoming-attacks/csv-imports:
    parameters:
      - $ref: '#/components/parameters/world'
    post:
      tags:
        - incoming-attacks
      summary: Import incoming attacks from a CSV export.
      operationId: importIncomingAttacksCsv
      description: |
        Imports incoming attacks as the current user. Unlike an SOS request, each attack carries its game command id.

        The first line is the header `commandId,source,target,player,arrivalEpochMilli,size,name`, matched
        case-insensitively. Each further line is one attack:
        - `commandId`: the game command id.
        - `source`, `target`: the game ids of the source and target village.
        - `player`: the game id of the attacker.
        - `arrivalEpochMilli`: the arrival as epoch milliseconds.
        - `size`: an `AttackSize` (case-insensitive), or empty if unknown.
        - `name`: the command name. It may contain commas if quoted; quotes inside are doubled.

        Lines that cannot be parsed, attacks already arrived and attacks with an unknown village or attacker are
        skipped, as are further lines with a command id already listed. Attacks the user imported before are updated. At most
        1000 attacks per request, and 15000 per user and world within 12 hours.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportIncomingAttacksCsvRequest'
      responses:
        200:
          description: The imported attacks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportedIncomingAttacks'
        400:
          $ref: '#/components/responses/badRequest'
        401:
          $ref: '#/components/responses/unauthorized'
components:
  securitySchemes:
    defaultApiKey:
      description: API Key provided to accounts on twforge.net
      type: apiKey
      name: Authorization
      in: header
  parameters:
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 0
    pageSize:
      name: size
      in: query
      required: false
      schema:
        type: integer
        format: int32
        default: 10
        maximum: 1000
    world:
      name: world
      in: path
      required: true
      description: |
        The world that this operation is in the context of.
        
        Can usually be read from `game_data.world`.
      schema:
        type: string
        example: de250
  responses:
    badRequest:
      description: There was a mistake in the data supplied in the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    unauthorized:
      description: The API key supplied in the Authorization header is not valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    notFound:
      description: The resource does not exist or is not visible to the current user.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Page:
      type: object
      required:
        - totalElements
        - totalPages
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    ReportImportRequest:
      type: object
      required:
        - text
      properties:
        text:
          type: string
          description: The text containing the slugs or public links to the reports.
          example: |
            - [report]51d634ed239b48e5cabf521cd67e24a4[/report]
            - [report]030b126e7b764e3691c26626b703c454[/report]
            
            https://de250.die-staemme.de/public_report/030b126e7b764e3691c26626b703c454
    ReportImportResponse:
      type: object
      required:
        - added
      properties:
        added:
          type: integer
          format: int32
          description: The number of reports that were successfully added to the queue.
    # DB Info Models
    DbInfoTribalWarsRequest:
      type: object
      required:
        - Key
        - X
        - Y
      properties:
        Key:
          type: string
          description: API authentication key
        X:
          type: integer
          description: X coordinate of the village
        Y:
          type: integer
          description: Y coordinate of the village
    DbInfoTribalwarsResponse:
      type: object
      required:
        - village_id
        - type
        - attacks
        - sos
      properties:
        village_id:
          type: string
          description: Unique village identifier
        type:
          type: integer
          description: Village type (0 = Deff, 1 = Off)
        unit_time:
          type: integer
          format: int64
          description: UNIX timestamp of unit data
        attacks:
          type: integer
          description: Number of incoming attacks
        report_id:
          type: string
          description: ID of the most recent report
        report_fighttime:
          type: integer
          format: int64
          description: UNIX timestamp of the most recent report
        attack_report:
          $ref: '#/components/schemas/DbInfoBattleReport'
        defend_report:
          $ref: '#/components/schemas/DbInfoBattleReport'
        sos:
          type: array
          description: Array of incoming attacks (required, can be empty)
          items:
            $ref: '#/components/schemas/DbInfoIncomingAttack'
        spear:
          type: integer
          description: Number of spear units in village
        sword:
          type: integer
          description: Number of sword units in village
        axe:
          type: integer
          description: Number of axe units in village
        archer:
          type: integer
          description: Number of archer units in village
        spy:
          type: integer
          description: Number of spy units in village
        light:
          type: integer
          description: Number of light cavalry units in village
        marcher:
          type: integer
          description: Number of mounted archer units in village
        heavy:
          type: integer
          description: Number of heavy cavalry units in village
        ram:
          type: integer
          description: Number of ram units in village
        catapult:
          type: integer
          description: Number of catapult units in village
        snob:
          type: integer
          description: Number of nobleman units in village
    DbInfoBattleReport:
      type: object
      description: Battle report object
      properties:
        report_id:
          type: string
          description: Unique report identifier
        fighttime:
          type: integer
          format: int64
          description: UNIX timestamp of the battle
        spear:
          type: integer
          description: Number of spear units
        sword:
          type: integer
          description: Number of sword units
        axe:
          type: integer
          description: Number of axe units
        archer:
          type: integer
          description: Number of archer units
        spy:
          type: integer
          description: Number of spy units
        light:
          type: integer
          description: Number of light cavalry units
        marcher:
          type: integer
          description: Number of mounted archer units
        heavy:
          type: integer
          description: Number of heavy cavalry units
        ram:
          type: integer
          description: Number of ram units
        catapult:
          type: integer
          description: Number of catapult units
        snob:
          type: integer
          description: Number of nobleman units
        loss_spear:
          type: integer
          description: Number of spear units lost
        loss_sword:
          type: integer
          description: Number of sword units lost
        loss_axe:
          type: integer
          description: Number of axe units lost
        loss_archer:
          type: integer
          description: Number of archer units lost
        loss_spy:
          type: integer
          description: Number of spy units lost
        loss_light:
          type: integer
          description: Number of light cavalry units lost
        loss_marcher:
          type: integer
          description: Number of mounted archer units lost
        loss_heavy:
          type: integer
          description: Number of heavy cavalry units lost
        loss_ram:
          type: integer
          description: Number of ram units lost
        loss_catapult:
          type: integer
          description: Number of catapult units lost
        loss_snob:
          type: integer
          description: Number of nobleman units lost
    DbInfoIncomingAttack:
      type: object
      required:
        - attacker_village_id
        - attacker_coords
        - unit_type
        - fighttime
        - arrival_time
        - prediction_reason
        - duplicate_count
      properties:
        attacker_village_id:
          type: string
          description: ID of the attacking village
        attacker_coords:
          type: string
          description: Coordinates of the attacking village (format XXX|YYY)
        unit_type:
          type: string
          description: Type of unit leading the attack
        fighttime:
          type: integer
          format: int64
          description: UNIX timestamp when the battle will occur
        arrival_time:
          type: integer
          format: int64
          description: UNIX timestamp when the attack was first detected arriving
        prediction:
          type: integer
          description: Attack size prediction (1=small, 2=possible off, 3=medium, 4=large)
          enum: [ 1, 2, 3, 4 ]
        prediction_reason:
          type: string
          description: Reason for the prediction classification
        duplicate_count:
          type: integer
          description: Number of duplicate incoming attacks from the same source

    ErrorResponse:
      type: object
      required:
        - timestamp
        - code
        - message
        - rejectedArguments
        - args
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: string
        message:
          type: string
        rejectedArguments:
          type: array
          items:
            $ref: '#/components/schemas/RejectedArgument'
        args:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
    RejectedArgument:
      type: object
      required:
        - path
        - code
        - args
      properties:
        path:
          type: string
        code:
          type: string
        args:
          type: object
          additionalProperties:
            type: string
    TribeSkillActivation:
      type: object
      required:
        - id
        - playerId
        - strength
        - validFrom
        - validUntil
        - actions
      properties:
        id:
          type: integer
          format: int64
        playerId:
          type: integer
          format: int64
        strength:
          type: integer
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - delete
    CreateTribeSkillActivationRequest:
      type: object
      required:
        - strength
        - validUntil
      properties:
        strength:
          type: integer
          minimum: 1
          maximum: 20
        validUntil:
          type: string
          format: date-time
    SigilDistressActivation:
      type: object
      required:
        - id
        - villageId
        - strength
        - validFrom
        - validUntil
        - actions
      properties:
        id:
          type: integer
          format: int64
        villageId:
          type: integer
        strength:
          type: integer
        validFrom:
          type: string
          format: date-time
        validUntil:
          type: string
          format: date-time
        actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - delete
    SigilOfDistressStrength:
      type: string
      enum:
        - TEN
        - TWENTY
        - THIRTY
    CreateSigilDistressActivationRequest:
      type: object
      required:
        - strength
        - validUntil
      properties:
        strength:
          $ref: '#/components/schemas/SigilOfDistressStrength'
        validUntil:
          type: string
          format: date-time
    ActiveSupportBoost:
      type: object
      required:
        - strength
        - tribeSkill
        - sigil
      properties:
        strength:
          type: integer
          description: Combined support boost strength.
        tribeSkill:
          type: integer
        sigil:
          type: integer
    IncomingAttackPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required:
            - content
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/IncomingAttack'
    IncomingAttack:
      type: object
      required:
        - id
        - name
        - unit
        - targetId
        - sourceId
        - sourceX
        - sourceY
        - attackerId
        - attackerName
        - arrival
        - sendTime
        - actions
        - attackCount
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        unit:
          type: string
        targetId:
          type: integer
          format: int32
        sourceId:
          type: integer
          format: int32
        sourceX:
          type: integer
          format: int32
        sourceY:
          type: integer
          format: int32
        attackerId:
          type: integer
          format: int64
        attackerName:
          type: string
        defenderId:
          type: integer
          format: int64
        arrival:
          type: string
          format: date-time
        sendTime:
          type: string
          format: date-time
        actions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - EDIT
              - DELETE
        attackSize:
          $ref: '#/components/schemas/AttackSize'
        rating:
          $ref: '#/components/schemas/AttackRating'
        commandId:
          type: integer
          format: int64
          description: >-
            The game's command id, usable as an exact match key for attack rows in the game UI.
            Absent for attacks imported from plain SoS requests.
        attackCount:
          type: integer
          format: int32
    AttackRating:
      type: object
      required:
        - attackSize
        - isOffensive
      properties:
        attackSize:
          $ref: '#/components/schemas/AttackSize'
        isOffensive:
          type: boolean
        watchtowerDetected:
          type: boolean
        defensiveSourceVillage:
          type: boolean
        units:
          $ref: '#/components/schemas/Troops'
        transit:
          $ref: '#/components/schemas/Troops'
    StandaloneAttackRating:
      type: object
      required:
        - sourceId
        - targetId
        - arrival
        - rating
      properties:
        sourceId:
          type: integer
        targetId:
          type: integer
        arrival:
          type: string
          description: Arrival as formatted by the game.
        rating:
          $ref: '#/components/schemas/AttackRating'
    AttackSize:
      type: string
      enum:
        - SMALL
        - MEDIUM_SMALL
        - MEDIUM
        - LARGE
    Troops:
      type: object
      additionalProperties:
        type: integer
        format: int32
    VillageDossier:
      type: object
      description: Everything known about one village.
      required:
        - reports
        - troopsOutside
        - notes
      properties:
        orientation:
          $ref: '#/components/schemas/VillageOrientation'
        lastConquest:
          type: string
          format: date-time
        buildings:
          $ref: '#/components/schemas/DossierBuildings'
        reports:
          $ref: '#/components/schemas/DossierReports'
        troopsOutside:
          type: array
          items:
            $ref: '#/components/schemas/DossierTroopsOutside'
          description: >-
            Troop movements of this village that are still travelling home, soonest arrival first.
        notes:
          type: array
          maxItems: 10
          description: The 10 most recently changed notes for this village, newest first.
          items:
            $ref: '#/components/schemas/DossierNote'
    DossierBuildings:
      type: object
      description: >
        Newest known building levels of the village. A level of 0 means the building was observed to be missing, an
        absent level that it is unknown. Absent as a whole when none of them is known.
      properties:
        watchtowerLevel:
          type: integer
          format: int32
          minimum: 0
        churchLevel:
          type: integer
          format: int32
          minimum: 0
        firstChurch:
          type: boolean
          description: Whether the church is a first church. Absent unless a church of level 1 or higher is known.
    DossierReports:
      type: object
      required:
        - latest
      properties:
        latest:
          type: array
          maxItems: 10
          description: The 10 latest reports about this village, newest first.
          items:
            $ref: '#/components/schemas/DossierReportRef'
        bestTroop:
          $ref: '#/components/schemas/DossierBestTroopReport'
        bestDefense:
          allOf:
            - $ref: '#/components/schemas/DossierReportRef'
          description: >-
            The newest report revealing the village's defense state: a visible garrison, wall or
            catapult damage, or a large arrived attack.
    DossierBestTroopReport:
      type: object
      description: >-
        The report best characterizing the village's own army: the one showing the most attributable farm population.
      required:
        - report
        - seenPopulation
      properties:
        report:
          $ref: '#/components/schemas/DossierReportRef'
        seenPopulation:
          type: integer
          format: int32
          description: Attributable farm population seen in the report.
    VillageOrientation:
      type: string
      enum:
        - OFFENSIVE
        - DEFENSIVE
    DossierTroopsOutside:
      description: One army of this village still on its way home (i.e. the survivors of an attack it sent).
      type: object
      required:
        - units
        - asOf
        - estimatedReturn
        - report
      properties:
        units:
          $ref: '#/components/schemas/Troops'
        asOf:
          description: The time of the fight the survivors are returning from.
          type: string
          format: date-time
        estimatedReturn:
          description: When the units is expected home.
          type: string
          format: date-time
        report:
          allOf:
            - $ref: '#/components/schemas/DossierReportRef'
          description: The report these numbers were read from.
    DossierReportRef:
      type: object
      required:
        - id
        - time
        - name
        - icons
      properties:
        id:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        name:
          type: string
        icons:
          type: array
          items:
            $ref: '#/components/schemas/DossierReportIcon'
        dot:
          $ref: '#/components/schemas/ReportDot'
        attackSize:
          $ref: '#/components/schemas/AttackSize'
        sourceVillageId:
          type: integer
          format: int32
        targetVillageId:
          type: integer
          format: int32
    DossierReportIcon:
      type: string
      enum:
        - KNIGHT
        - SNOB
        - SPY
    DossierNote:
      type: object
      description: >-
        A note kept on this village. `note` and `addedByUser` are free text written by players and
        must be rendered as text, never as markup.
      required:
        - note
        - addedByUser
        - lastModifiedAt
      properties:
        note:
          type: string
        addedByUser:
          type: string
        lastModifiedAt:
          type: string
          format: date-time
        type:
          $ref: '#/components/schemas/DossierNoteType'
    DossierNoteType:
      type: string
      enum:
        - OFFENSIVE
        - DEFENSIVE
    BattleReport:
      type: object
      description: A stored battle report.
      required:
        - id
        - name
        - title
        - time
        - luck
        - morale
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        title:
          type: string
        time:
          type: string
          format: date-time
        luck:
          type: number
          format: double
        morale:
          type: integer
          format: int32
        dot:
          $ref: '#/components/schemas/ReportDot'
        attackSize:
          $ref: '#/components/schemas/AttackSize'
        attacker:
          $ref: '#/components/schemas/Player'
        attackerVillage:
          $ref: '#/components/schemas/Village'
        attackerQuantity:
          $ref: '#/components/schemas/Troops'
        attackerLosses:
          $ref: '#/components/schemas/Troops'
        attackerReligious:
          type: boolean
        attackEffects:
          type: array
          items:
            $ref: '#/components/schemas/ReportEffect'
        defender:
          $ref: '#/components/schemas/Player'
        defenderVillage:
          $ref: '#/components/schemas/Village'
        defenderQuantity:
          $ref: '#/components/schemas/Troops'
        defenderLosses:
          $ref: '#/components/schemas/Troops'
        defenderReligious:
          type: boolean
        defenderEffects:
          type: array
          items:
            $ref: '#/components/schemas/ReportEffect'
        resources:
          allOf:
            - $ref: '#/components/schemas/ReportResources'
          description: Resources seen in the village by a scouting attack.
        buildings:
          type: object
          description: Building levels seen by a scouting attack, keyed by the game's building id.
          additionalProperties:
            type: integer
            format: int32
        unitsOutside:
          $ref: '#/components/schemas/Troops'
        haul:
          allOf:
            - $ref: '#/components/schemas/ReportResources'
          description: Resources actually carried off.
        catapultDamage:
          $ref: '#/components/schemas/BuildingDamage'
        ramDamage:
          $ref: '#/components/schemas/WallDamage'
        loyalty:
          $ref: '#/components/schemas/Loyalty'
        killedSupports:
          type: array
          items:
            $ref: '#/components/schemas/KilledSupport'
    Player:
      type: object
      required:
        - id
        - name
        - villages
        - points
        - rank
        - deleted
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        tribeId:
          type: integer
          format: int32
        villages:
          type: integer
          format: int32
        points:
          type: integer
          format: int32
        rank:
          type: integer
          format: int32
        deleted:
          type: boolean
    Village:
      type: object
      required:
        - id
        - name
        - x
        - y
        - points
        - bonus
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        x:
          type: integer
          format: int32
        y:
          type: integer
          format: int32
        playerId:
          type: integer
          format: int64
        points:
          type: integer
          format: int32
        bonus:
          type: integer
          format: int32
    ReportResources:
      type: object
      required:
        - wood
        - stone
        - iron
      properties:
        wood:
          type: integer
          format: int32
        stone:
          type: integer
          format: int32
        iron:
          type: integer
          format: int32
    ReportEffect:
      type: object
      required:
        - type
        - strength
      properties:
        type:
          $ref: '#/components/schemas/ReportEffectType'
        strength:
          type: integer
          format: int32
        unit:
          type: string
    ReportEffectType:
      type: string
      enum:
        - ITEM
        - FLAG_ATTACK
        - FLAG_DEFENSE
        - ATTACK
        - DEFENSE
        - STEALTH
        - AWARENESS
        - BUILDING_DAMAGE
        - WALL_NERF
        - WALL_EFFECTIVENESS
        - RESIST_DEMOLITION
        - LOYALTY
    BuildingDamage:
      type: object
      required:
        - building
        - levelBefore
        - levelAfter
      properties:
        building:
          type: string
        levelBefore:
          type: integer
          format: int32
        levelAfter:
          type: integer
          format: int32
    WallDamage:
      type: object
      required:
        - levelBefore
        - levelAfter
      properties:
        levelBefore:
          type: integer
          format: int32
        levelAfter:
          type: integer
          format: int32
    Loyalty:
      type: object
      required:
        - before
        - after
      properties:
        before:
          type: integer
          format: int32
        after:
          type: integer
          format: int32
    KilledSupport:
      type: object
      required:
        - village
        - units
      properties:
        village:
          $ref: '#/components/schemas/Village'
        units:
          $ref: '#/components/schemas/Troops'
    ReportDot:
      type: string
      enum:
        - GREEN
        - YELLOW
        - RED
        - BLUE
        - RED_YELLOW
        - RED_BLUE
    ImportIncomingAttacksSosRequest:
      type: object
      required:
        - sosRequest
      properties:
        sosRequest:
          type: string
    ParsedSosRequest:
      type: object
      required:
        - attacks
      properties:
        attacks:
          type: array
          items:
            $ref: '#/components/schemas/IncomingAttack'
    ImportIncomingAttacksCsvRequest:
      type: object
      required:
        - csv
      properties:
        csv:
          type: string
          minLength: 1
    ImportedIncomingAttacks:
      type: object
      required:
        - attacks
      properties:
        attacks:
          type: array
          items:
            $ref: '#/components/schemas/IncomingAttack'
