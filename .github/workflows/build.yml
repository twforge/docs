name: Build Documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history, needed to compare the API contract with the base branch (merge-base)
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup oasdiff
        uses: ./.github/actions/setup-oasdiff

      - name: Check API contract (lint, package, compatibility)
        run: npm run api:ci

      - name: Build Antora site
        run: npm run build
