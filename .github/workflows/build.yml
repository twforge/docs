name: Build Documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, needed to compare the API contract with the base branch (merge-base)
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup oasdiff
        uses: ./.github/actions/setup-oasdiff

      - name: Check API contract (lint, package, compatibility)
        run: npm run api:ci

      - name: Build Antora site
        run: npm run build
