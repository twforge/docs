name: Publish Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# The `build` job installs dependencies and builds the site with read-only permissions. Only the `deploy` job, which
# installs nothing and runs no repository code, gets the permissions to deploy to GitHub Pages.
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Antora site
        run: npm run build

      - name: Lint OpenAPI spec
        run: npm run lint:api

      - name: Add CNAME file
        run: cp supplemental-ui/root/CNAME build/site/CNAME

      - name: Copy Swagger UI
        run: |
          mkdir -p build/site/developer-api/js
          mkdir -p build/site/developer-api/css
          cp node_modules/swagger-ui-dist/swagger-ui-bundle.js node_modules/swagger-ui-dist/swagger-ui-standalone-preset.js build/site/developer-api/js/
          cp node_modules/swagger-ui-dist/swagger-ui.css build/site/developer-api/css/
          cp developer-api/swagger-ui/index.html developer-api/openapi.yaml build/site/developer-api/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write     # deploy to GitHub Pages
      id-token: write  # verify the deployment source
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
