name: Release API Contract

# Releases the Developer API contract (developer-api/) as the npm package @twforge/developer-api with release-please;
# see README.md ("Releasing"). The contract checks run on every PR, including the release PR; this workflow only builds
# and publishes.
#
# release-please uses a GitHub App token, so CI runs on its release PRs (pushes made with GITHUB_TOKEN trigger no
# workflows). The `build` job installs dependencies and builds the package with read-only permissions; only the
# `publish` job, which installs nothing and runs no repository code, may stage the package on npm and change the release.
#
# The package is staged (`npm stage publish`), not published: it only goes live when a maintainer approves it with 2FA
# on npmjs.com, see README.md ("Releasing").

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs['developer-api--release_created'] }}
      tag: ${{ steps.release.outputs['developer-api--tag_name'] }}
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write  # release-please labels its PRs

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run api:package

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: developer-api-package
          path: build/developer-api-package
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach files to the GitHub release
      id-token: write  # npm trusted publishing / provenance
    steps:
      - name: Download package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: developer-api-package
          path: package

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts: the package has no lifecycle scripts; make sure none run with publish permissions.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack ./package --ignore-scripts --pack-destination "$RUNNER_TEMP/dist"

      # Attached before staging (--clobber makes it repeatable), so a failed step never leaves a staged version behind
      # and "Re-run failed jobs" just works.
      - name: Attach package and spec to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/dist"/*.tgz package/openapi.yaml package/openapi.json --clobber

      # Staged publishing (npm 11.15+): the version is uploaded but stays private until a maintainer approves it with
      # 2FA, so neither this workflow nor its credentials can make a version public on their own.
      # Authenticates with npm trusted publishing (OIDC, allowed action "npm stage publish" only); there is no npm token.
      # The tarball path must start with "./": npm reads "dist/x.tgz" as a GitHub shorthand.
      - name: Stage on npm
        run: |
          cd "$RUNNER_TEMP/dist"
          npm stage publish ./*.tgz --provenance --ignore-scripts

      - name: Summary
        run: |
          spec="$(node -p "const p = require('./package/package.json'); p.name + '@' + p.version")"
          {
            echo "### \`$spec\` is staged on npm"
            echo
            echo "It is not public yet. Approve it with 2FA on npmjs.com (package page → *Staged Packages*), or with"
            echo "\`npm stage list $spec\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
